    <script>
      /*
        Chrome fires `beforeinstallprompt` ONCE, very early, and only if you call
        preventDefault() does it keep the event for later use. The install card
        used to attach its listener inside a React effect — which runs after the
        bundle has downloaded, parsed and mounted. On a warm cache React won the
        race and the button appeared; on a cold one Chrome fired first, nothing
        was listening, the event was gone for that page load, and the card
        silently fell back to written instructions.

        That is exactly the reported symptom: refresh and the button appears,
        reopen and it does not. Nothing random about it — a race, decided by how
        fast the JavaScript loaded.

        So the listener lives here instead, inline in <head>, running before
        anything else on the page can. The event is parked on `window` and the
        card collects it whenever it mounts, early or late.
      */
      window.__oaInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__oaInstallPrompt = e;
        window.dispatchEvent(new Event("oa-install-ready"));
      });
      window.addEventListener("appinstalled", function () {
        window.__oaInstallPrompt = null;
        window.dispatchEvent(new Event("oa-installed"));
      });

      /*
        The service worker. Registered after load so it never competes with the
        app for the first paint.

        Two jobs, and the second one surprises people: it is what makes the app
        genuinely openable with no internet — the browser's own HTTP cache does
        that *sometimes*, but it is evicted under storage pressure and after a
        stretch of not being opened, so offline "works" right up until it does
        not — and it is also the only reason Chrome will ever offer to install
        this app. `beforeinstallprompt` above can never fire without one.

        Everything about how it caches, and the stale-file trap it deliberately
        avoids, is documented at the top of sw.js.
      */
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function () {
            /* An unregistered worker costs offline support and the install
               button, and nothing else. The app works exactly as before. */
          });
        });
      }
    </script>
